# Divoom Pixoo 64 (Wohnzimmer) – Seitenkonfiguration
#
# Integration: divoom_pixoo (https://github.com/gickowtf/pixoo-homeassistant)
# Eintragen unter: Einstellungen → Geräte & Dienste → Divoom Pixoo 64 → Konfigurieren → pages_data
# Gerät: 192.168.178.95, Abfrageintervall 1 s
#
# Temperaturen werden mit '%4.1f' auf feste Breite gebracht (unter 10 ° mit führendem Leerzeichen).
# Ist ein Sensor nicht verfügbar, erscheint '--' statt "Template Error".

- page_type: components
  components:
    # Wetter-Icon oben rechts
    - type: image
      image_path: "/config/custom_components/divoom_pixoo/img/weather/{{ states('weather.forecast_home') }}.png"
      position: [46, 7]
      height: 8
      width: 8

    # Uhrzeit
    - type: text
      content: "{{ now().strftime('%H:%M') }}"
      font: clock
      position: [6, 5]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Wochentag und Datum
    - type: text
      content: "{% set days = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] %} {{ days[now().weekday()] }} {{ now().strftime('%d.%m.%Y') }}"
      font: pico_8
      position: [6, 21]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Innen: Aqara-Sensor 6
    - type: text
      content: "{% set t = states('sensor.aqara_sensor_6_temperature') %}{% set h = states('sensor.aqara_sensor_6_humidity') %}IN  {{ '%4.1f' | format(t | float) if is_number(t) else '  --' }}° {{ h | round(0, default='--') }}%"
      font: pico_8
      position: [6, 33]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Außen: Aqara-Sensor 1
    - type: text
      content: "{% set t = states('sensor.aqara_sensor_1_temperature') %}{% set h = states('sensor.aqara_sensor_1_humidity') %}OUT {{ '%4.1f' | format(t | float) if is_number(t) else '  --' }}° {{ h | round(0, default='--') }}%"
      font: pico_8
      position: [6, 40]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Statuszeile unten: Handy + Anzahl im WLAN, gekipptes Fenster + Anzahl offen, 10 Pixel hoch (y50–59).
    # Eine einzige Vorlage zeichnet beide Icons Pixel für Pixel ('#' = Farbe) und setzt die Zeile
    # mittig unter die Temperaturzeilen, auch wenn eine Zahl zweistellig wird.
    - type: templatable
      template: |-
        {#- Statuszeile unten: Handy + Anzahl im WLAN, Fenster (gekippt) + Anzahl offen.
            Wird als Ganzes mittig unter die Temperaturzeilen gesetzt (die reichen von x6 bis x55, Mitte 30,5).
            pico_8: jedes Zeichen 3 Pixel breit + 1 Pixel Abstand. -#}
        {%- set c = states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list -%}
        {%- set phones = ['device_tracker.michahandy_michahandypixel8pro', 'device_tracker.manufairphone', 'device_tracker.manuhandy', 'device_tracker.huawei_p8', 'device_tracker.iphone', 'device_tracker.pixel_4a_5g'] -%}
        {%- set windows = ['binary_sensor.0x54ef44100142bf54_contact', 'binary_sensor.fenster_sensor_bad_aqara_contact'] -%}
        {#- Handy zählt, wenn 'home' und in den letzten 10 Minuten erreichbar (blendet alte Fritzbox-Einträge aus) -#}
        {%- set ns = namespace(n=0, out=[]) -%}
        {%- for e in phones -%}
          {%- set t = state_attr(e, 'last_time_reachable') -%}
          {%- if is_state(e, 'home') and t and (now() - as_datetime(t | string)).total_seconds() < 600 -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
        {%- endfor -%}
        {%- set n_phones = ns.n | string -%}
        {%- set n_windows = windows | select('is_state', 'on') | list | count | string -%}
        {%- set phone = [
          '.####.',
          '######',
          '#....#',
          '#....#',
          '#....#',
          '#....#',
          '#....#',
          '######',
          '##..##',
          '.####.'] -%}
        {%- set window = [
          '########...',
          '#......#...',
          '#...#######',
          '#..##....##',
          '#..#.....#.',
          '#.##....##.',
          '#.#.....#..',
          '##.....##..',
          '#.######...',
          '########...'] -%}
        {%- set y0 = 50 -%}
        {%- set w1 = n_phones | length * 4 - 1 -%}
        {%- set w2 = n_windows | length * 4 - 1 -%}
        {#- Breite: Handy 6, Abstand 2, Zahl, Abstand 3, Fenster 11, Abstand 2, Zahl -#}
        {%- set total = 6 + 2 + w1 + 3 + 11 + 2 + w2 -%}
        {%- set x0 = ((61 - total) / 2) | round(0, 'ceil') | int -%}
        {%- set x_win = x0 + 6 + 2 + w1 + 3 -%}
        {%- for icon in [[phone, x0], [window, x_win]] -%}
          {%- for row in icon[0] -%}
            {%- set y = y0 + loop.index0 -%}
            {%- for ch in row -%}
              {%- if ch == '#' -%}
                {%- set ns.out = ns.out + [{'type': 'rectangle', 'position': [icon[1] + loop.index0, y], 'size': [1, 1], 'color': c}] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- set ns.out = ns.out + [
          {'type': 'text', 'content': n_phones, 'font': 'pico_8', 'position': [x0 + 8, y0 + 2], 'color': c},
          {'type': 'text', 'content': n_windows, 'font': 'pico_8', 'position': [x_win + 13, y0 + 2], 'color': c}] -%}
        {{ ns.out }}
