# Divoom Pixoo 64 (Wohnzimmer) – Seitenkonfiguration
#
# Integration: divoom_pixoo (https://github.com/gickowtf/pixoo-homeassistant)
# Eintragen unter: Einstellungen → Geräte & Dienste → Divoom Pixoo 64 → Konfigurieren → pages_data
# Gerät: 192.168.178.95, Abfrageintervall 1 s
#
# Temperaturen werden mit '%4.1f' auf feste Breite gebracht (unter 10 ° mit führendem Leerzeichen).
# Ist ein Sensor nicht verfügbar, erscheint '--' statt "Template Error".

- page_type: components
  components:
    # Wetter-Icon oben rechts
    - type: image
      image_path: "/config/custom_components/divoom_pixoo/img/weather/{{ states('weather.forecast_home') }}.png"
      position: [46, 7]
      height: 8
      width: 8

    # Uhrzeit
    - type: text
      content: "{{ now().strftime('%H:%M') }}"
      font: clock
      position: [6, 5]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Wochentag und Datum
    - type: text
      content: "{% set days = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] %} {{ days[now().weekday()] }} {{ now().strftime('%d.%m.%Y') }}"
      font: pico_8
      position: [6, 21]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Innen: Aqara-Sensor 6
    - type: text
      content: "{% set t = states('sensor.aqara_sensor_6_temperature') %}{% set h = states('sensor.aqara_sensor_6_humidity') %}IN  {{ '%4.1f' | format(t | float) if is_number(t) else '  --' }}° {{ h | round(0, default='--') }}%"
      font: pico_8
      position: [6, 33]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Außen: Aqara-Sensor 1
    - type: text
      content: "{% set t = states('sensor.aqara_sensor_1_temperature') %}{% set h = states('sensor.aqara_sensor_1_humidity') %}OUT {{ '%4.1f' | format(t | float) if is_number(t) else '  --' }}° {{ h | round(0, default='--') }}%"
      font: pico_8
      position: [6, 40]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"

    # Handy-Icon unten links, 7 x 11 Pixel, 5 Pixel unter der OUT-Zeile (pico_8 ist 5 Pixel hoch: 40–44)
    #   y50  .#####.
    #   y51  #######
    #   y52  #.....#   Display (schwarz ausgespart)
    #   ...
    #   y57  #.....#
    #   y58  #######
    #   y59  ###.###   Home-Taste
    #   y60  .#####.
    - type: rectangle   # obere Kante, Ecken abgerundet
      position: [7, 50]
      size: [5, 1]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"
    - type: rectangle   # Gehäuse
      position: [6, 51]
      size: [7, 9]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"
    - type: rectangle   # untere Kante, Ecken abgerundet
      position: [7, 60]
      size: [5, 1]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"
    - type: rectangle   # Display
      position: [7, 52]
      size: [5, 6]
      color: [0, 0, 0]
    - type: rectangle   # Home-Taste
      position: [9, 59]
      size: [1, 1]
      color: [0, 0, 0]

    # Anzahl der Handys im WLAN: Fritzbox-Tracker 'home' und in den letzten 10 Minuten erreichbar.
    # Die Zeitprüfung blendet alte Einträge aus, die die Fritzbox weiter als aktiv führt
    # (z. B. Android mit wechselnder Zufalls-MAC, angemeldet über das devolo-WLAN).
    - type: text
      content: "{% set ns = namespace(n=0) %}{% for e in ['device_tracker.michahandy_michahandypixel8pro', 'device_tracker.manufairphone', 'device_tracker.manuhandy', 'device_tracker.huawei_p8', 'device_tracker.iphone', 'device_tracker.pixel_4a_5g'] %}{% set t = state_attr(e, 'last_time_reachable') %}{% if is_state(e, 'home') and t and (now() - as_datetime(t | string)).total_seconds() < 600 %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}{{ ns.n }}"
      font: pico_8
      position: [15, 53]
      color: "{{ states('input_select.pixoo_farbe').split('|')[1].split(',') | map('int') | list }}"
