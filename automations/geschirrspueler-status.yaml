# Automation: automation.geschirrspuler_status (id geschirrspuler_status), angelegt 2026-11-18
#
# Setzt input_select.geschirrspuler_status (Helfer, Optionen Bereit / Läuft / Fertig / Ausräumen)
# aus der Leistung der Steckdose Geschirrspüler und dem Türsensor (Aqara T1):
#   Bereit -> Läuft:  mehr als 2 W für 1 Minute (2026-11-18: erst 10 W / 2 min, dann 4 W; Standby mit Programm unter 1 W)
#                     Nur aus „Bereit“ heraus (seit 2026-11-18), damit der Rest-Verbrauch nach dem Programm
#                     (bis 2,7 W) „Fertig“/„Ausräumen“ nicht zurück auf „Läuft“ setzt. Neuer Spülgang wird
#                     also erst nach dem Ausräumen (Tür auf > 45 s, dann zu) erkannt.
#   Läuft  -> Fertig: 0 W (unter 1 W) für 15 Minuten, dazu ntfy-Meldung an beide
#                     (bis 2026-11-18 unter 3 W; nach dem Programm pendelt er 0–2,7 W)
#                     (notify.handy_frau, normale Priorität, seit 2026-11-18)
#   Fertig -> Ausräumen: Tür länger als 45 Sekunden offen (seit 2026-11-18)
#   Ausräumen -> Bereit: Tür wieder zu
# Tür nur kurz auf (unter 45 s, z. B. Dampf rauslassen): bleibt „Fertig“.
# Die Grenzwerte sind geschätzt und nach dem ersten Spülgang anhand der Leistungskurve
# zu prüfen. Achtung Trocknungsphase: Viele Geräte ziehen dabei kaum Strom.
#
# Eintragen: Einstellungen → Automationen → neu → YAML bearbeiten.

alias: "Geschirrspüler: Status"
description: Bereit / Läuft / Fertig / Ausräumen aus Leistung und Türsensor
mode: queued
triggers:
  - trigger: numeric_state
    entity_id: sensor.steckdose_geschirrspuler_power
    above: 2
    for: "00:01:00"
    id: laeuft
  - trigger: numeric_state
    entity_id: sensor.steckdose_geschirrspuler_power
    below: 1
    for: "00:15:00"
    id: fertig
  - trigger: state
    entity_id: binary_sensor.geschirrspuler_tur_contact
    to: "on"
    for: "00:00:45"
    id: tuer_auf
  - trigger: state
    entity_id: binary_sensor.geschirrspuler_tur_contact
    to: "off"
    id: tuer_zu
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: laeuft
          - condition: state
            entity_id: input_select.geschirrspuler_status
            state: Bereit
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.geschirrspuler_status
            data:
              option: Läuft
      - conditions:
          - condition: trigger
            id: fertig
          - condition: state
            entity_id: input_select.geschirrspuler_status
            state: Läuft
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.geschirrspuler_status
            data:
              option: Fertig
          - action: ntfy.publish
            target:
              entity_id: notify.handy_frau
            data:
              title: Geschirrspüler fertig
              message: Der Geschirrspüler ist fertig und kann ausgeräumt werden.
              tags:
                - white_check_mark
      - conditions:
          - condition: trigger
            id: tuer_auf
          - condition: state
            entity_id: input_select.geschirrspuler_status
            state: Fertig
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.geschirrspuler_status
            data:
              option: Ausräumen
      - conditions:
          - condition: trigger
            id: tuer_zu
          - condition: state
            entity_id: input_select.geschirrspuler_status
            state: Ausräumen
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.geschirrspuler_status
            data:
              option: Bereit
