# Automation (id 1770289735146): Heizung: Tag-Werte automatisch sichern
# Gesichert aus Home Assistant am 2026-10-13.

id: "1770289735146"
alias: "Heizung: Tag-Werte automatisch sichern"
description: "Aktualisiert das Backup nur, wenn alle Heizungen über dem Limit stehen"
triggers:
  - entity_id:
      - "climate.thermostat_arbeitszimmer"
      - "climate.kuche"
      - "climate.thermostat_badezimmer"
      - "climate.thermostat_wohnzimmer"
      - "climate.schlafzimmer_aqara_thermostat"
    attribute: "temperature"
    trigger: "state"
conditions:
  - condition: "template"
    value_template: "{{ state_attr(trigger.entity_id, 'temperature') | float(0) > \n   states('input_number.temperatur_absenkung') | float(0) }}\n"
  - condition: "template"
    value_template: "{% set limit = states('input_number.temperatur_absenkung') | float(0) %} {% set thermostats = [\n  'climate.thermostat_arbeitszimmer',\n  'climate.kuche',\n  'climate.thermostat_badezimmer',\n  'climate.thermostat_wohnzimmer',\n  'climate.schlafzimmer_aqara_thermostat'\n] %} {{ thermostats | map('state_attr', 'temperature') | map('float', 0) | select('le', limit) | list | count == 0 }}\n"
actions:
  - action: "scene.create"
    data:
      scene_id: "heizung_tag_backup"
      entities:
        "climate.thermostat_arbeitszimmer":
          state: "{{ states('climate.thermostat_arbeitszimmer') }}"
          temperature: "{{ state_attr('climate.thermostat_arbeitszimmer', 'temperature') }}"
        "climate.kuche":
          state: "{{ states('climate.kuche') }}"
          temperature: "{{ state_attr('climate.kuche', 'temperature') }}"
        "climate.thermostat_badezimmer":
          state: "{{ states('climate.thermostat_badezimmer') }}"
          temperature: "{{ state_attr('climate.thermostat_badezimmer', 'temperature') }}"
        "climate.thermostat_wohnzimmer":
          state: "{{ states('climate.thermostat_wohnzimmer') }}"
          temperature: "{{ state_attr('climate.thermostat_wohnzimmer', 'temperature') }}"
        "climate.schlafzimmer_aqara_thermostat":
          state: "heat"
          temperature: "{{ state_attr('climate.schlafzimmer_aqara_thermostat', 'temperature') }}"
mode: "queued"
