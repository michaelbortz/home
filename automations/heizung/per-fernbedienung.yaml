    type: "action"
    subtype: "brightness_step_down_all"
    trigger: "device"
    id: "absenken"
conditions: []
actions:
  - choose:
      - conditions:
          - condition: "trigger"
            id: "heizen"
          - condition: "state"
            entity_id: "input_boolean.thermostat_sommermodus"
