# Skript script.heizung_modus_absenkung_aktivieren: Heizung: Modus Absenkung aktivieren
# Gesichert aus Home Assistant am 2026-10-13, geändert am 2026-10-16 (Danfoss Ally statt Aqara W600).

alias: "Heizung: Modus Absenkung aktivieren"
icon: "mdi:snowflake"
sequence:
  - action: "climate.set_temperature"
    target:
      entity_id:
        - "climate.thermostat_arbeitszimmer"
        - "climate.kuche"
        - "climate.thermostat_flur"
        - "climate.thermostat_wohnzimmer"
        - "climate.schlafzimmer_danfoss_ally"
    data:
      temperature: "{{ states('input_number.temperatur_absenkung') | float }}"
      hvac_mode: "heat"
mode: "single"
description: ""
