# Automation: automation.neue_automation_2 (id 1770282350009)
#
# Meldet ein Wasserleck, sobald einer der Aqara-Wassersensoren feucht wird.
# Seit 2026-11-21 auch der Bad Wassersensor (am Rohr im Bad); die Meldung nennt
# den Sensor, der ausgelöst hat.
# Meldung über ntfy (notify.handy_frau, höchste Priorität), das Micha und seine
# Frau beide abonniert haben. Bis 2026-10-24 ging es über die HA-App an Pixel 8 Pro
# und FP5; auf dem FP5 stellte die nicht zuverlässig zu.

alias: Wassersensor
description: ""
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.aqara_wassersensor_water_leak
      - binary_sensor.bad_wassersensor_water_leak
    from: "off"
    to: "on"
conditions: []
actions:
  - action: ntfy.publish
    target:
      entity_id: notify.handy_frau
    data:
      title: WASSERLECK
      message: "Wasserleck - {{ trigger.to_state.name | replace(' Feuchte', '') }} feucht"
      priority: "5"
      tags:
        - rotating_light
        - droplet
mode: queued
